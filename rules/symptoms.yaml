# Symptom-to-topic mapping for goal and title generation.
# Keys are symptom keywords found in the query; values define the output topic and title.
# First match wins (checked in order).

symptoms:
  - keywords: [crack, cracked, shattered, smashed, broken screen]
    topic: Screen Damage
    title: Screen display damage
    goal_type: troubleshooting

  - keywords: [blank, black screen, dark screen, no display, nothing on screen, won't turn on, not turning on, no image]
    topic: Blank Display
    title: Blank display issue
    goal_type: troubleshooting

  - keywords: [flicker, flash, flashing, blink, strobe]
    topic: Screen Flicker
    title: Screen flicker issue
    goal_type: troubleshooting

  - keywords: [touch, lag, laggy, delayed, unresponsive, responsiveness, slow response, touch sensitivity]
    topic: Touch Responsiveness
    title: Touch response issue
    goal_type: troubleshooting

  - keywords: [distort, distorted, garbled, glitch, corrupted]
    topic: Screen Distortion
    title: Screen distortion issue
    goal_type: troubleshooting

  - keywords: [rotate, rotation, orientation, landscape, portrait, auto rotate]
    topic: Screen Rotation
    title: Screen rotation issue
    goal_type: troubleshooting

  - keywords: [half black, half dark, partial display, one side]
    topic: Partial Display
    title: Partial display issue
    goal_type: troubleshooting

  - keywords: [floating circle, floating, assistant menu, quick shortcuts]
    topic: Floating Menu
    title: Floating menu removal
    goal_type: configuration

  - keywords: [small screen, doesn't fill, won't expand, screen size]
    topic: Screen Size
    title: Screen size adjustment
    goal_type: configuration

  - keywords: [data transfer, transfer data, migrate, QR code]
    topic: Data Transfer
    title: Data transfer issue
    goal_type: troubleshooting

  - keywords: [email, gmail, inbox]
    topic: Email
    title: Email connection issue
    goal_type: troubleshooting

  - keywords: [screen mirroring, smart view, casting, mirror]
    topic: Screen Mirroring
    title: Screen mirroring issue
    goal_type: troubleshooting

  - keywords: [multi window, split screen, app pair]
    topic: Multi Window
    title: Multi window setup
    goal_type: configuration

  - keywords: [camera, photo, video flicker]
    topic: Camera
    title: Camera display issue
    goal_type: troubleshooting

  - keywords: [charger, charging, plug in charger]
    topic: Charging Display
    title: Charging display issue
    goal_type: troubleshooting

  - keywords: [blue screen, tiny text, boot, startup]
    topic: Boot Failure
    title: Boot failure issue
    goal_type: troubleshooting

  - keywords: [activation, activate, carrier, deactivated]
    topic: Device Activation
    title: Device activation issue
    goal_type: troubleshooting

  - keywords: [inner screen, cover screen, fold screen]
    topic: Foldable Display
    title: Foldable display issue
    goal_type: troubleshooting

# Fallback — if nothing matches
fallback:
  topic: Screen
  title: Screen display issue
  goal_type: troubleshooting

